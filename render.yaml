services:
  - type: web
    name: entorno-salvador-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: FOGO_CRUZADO_API_URL
        value: https://api-service.fogocruzado.org.br/api/v2
      - key: FOGO_CRUZADO_WEB_SECRET
        sync: false

  - type: cron
    name: entorno-salvador-refresh
    runtime: node
    plan: starter
    schedule: "15 3 * * *"
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm exec tsx server/refresh-sources.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FOGO_CRUZADO_API_URL
        value: https://api-service.fogocruzado.org.br/api/v2
      - key: FOGO_CRUZADO_WEB_SECRET
        sync: false
